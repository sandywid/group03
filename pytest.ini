# pytest.ini (i projektroten)
[pytest]
addopts = -q -ra --maxfail=1 --cov=server --cov-report=term-missing:skip-covered --cov-report=xml --cov-report=html
testpaths = .
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Markers just in case
markers =
    requires_db: tests that need a reachable DB
